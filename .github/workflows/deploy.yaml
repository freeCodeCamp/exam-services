name: Image Build and Deploy

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy
        required: true
        type: string
      image_tag:
        description: Container tag (normally release version)
        required: false
        default: ""
        type: string
    secrets:
      DIGITALOCEAN_ACCESS_TOKEN:
        required: true
      DOCR_NAME:
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
      image_tag:
        description: Container tag (generated when omitted)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        site_tlds: [org]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Create image tag
        env:
          RELEASE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            TAGNAME="$RELEASE_TAG"
          else
            TAGNAME="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d-%H%M)"
          fi
          echo "tagname=$TAGNAME" >> "$GITHUB_ENV"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Build and tag image
        run: |
          docker build . \
            --tag registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/moderation-service:${{ env.tagname }} \
            --tag registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/moderation-service:latest \
            --file ./moderation-service/Dockerfile

      - name: Push image to DigitalOcean Container Registry
        run: |
          docker push registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/moderation-service:${{ env.tagname }}
          docker push registry.digitalocean.com/${{ secrets.DOCR_NAME }}/${{ matrix.site_tlds }}/moderation-service:latest
