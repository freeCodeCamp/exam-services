[package]
name = "exam-utils"
version = "3.2.0"
edition = "2024"
publish = false

[dependencies]
bson = { version = "3.1.0", features = ["serde", "serde_with-3", "chrono-0_4"] }
# `prisma` is used for its types only. Native consumers get the `db` module
# from their own direct `prisma` dependency.
prisma = { path = "../prisma", default-features = false }
rand = "0.10.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_with = "3.16.1"
thiserror = "2.0.17"
tracing = "0.1.41"
# Drop-in std::time on native, performance.now()-backed on wasm32-unknown-unknown
web-time = "1.1.0"
