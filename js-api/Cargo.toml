[package]
name = "js-api"
version = "0.2.0"
edition = "2024"
description = "WASM bindings for the freeCodeCamp exam-services utilities"
license = "BSD-3-Clause"
repository = "https://github.com/freeCodeCamp/exam-services"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bson = { version = "3.1.0", features = ["serde"] }
console_error_panic_hook = "0.1.7"
exam-utils = { path = "../exam-utils" }
prisma = { path = "../prisma", default-features = false }
serde = "1.0.219"
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.106"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand/bson source randomness through different getrandom major versions; each
# must enable `wasm_js`. Backend selection also uses /.cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
