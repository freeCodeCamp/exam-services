[package]
name = "moderation-service"
version = "3.4.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.33"
mongodb = { version = "3.8.0", features = ["bson-3"] }
prisma = { path = "../prisma" }
exam-utils = { path = "../exam-utils" }
sentry = { version = "0.49.0", features = ["tracing", "logs", "metrics"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
supabase_rs = "0.7.0"
chrono = { version = "0.4.43", features = ["serde"] }
postgrest = "1.6.0"

[dev-dependencies]
# mongo_drop = { version = "0.1.1", features = ["tracing"] }
prisma = { path = "../prisma" }
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }
