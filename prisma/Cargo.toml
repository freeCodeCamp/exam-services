[package]
name = "prisma"
version = "1.2.1"
edition = "2024"
publish = false

[dependencies]
bson = { version = "3.1.0", features = ["serde"] }
mongodb = { version = "3.8.0", features = ["bson-3"], optional = true }
chrono = { version = "0.4.43", features = ["serde"] }
prisma-rust-schema = { git = "https://github.com/ShaunSHamilton/prisma-rust-schema.git", version = "2.1.1", features = [
  "bson",
  "mongodb",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
tracing = "0.1.41"

[features]
# `db` pulls in the full MongoDB driver (tokio, TLS, DNS). Disable it
# (`default-features = false`) for wasm32 builds, which only need the types.
default = ["db"]
db = ["dep:mongodb"]
