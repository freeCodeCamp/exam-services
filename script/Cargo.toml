[package]
name = "script"
version = "1.2.0"
edition = "2024"
publish = false
default-run = "script"

[dependencies]
anyhow = "1.0.104"
mongodb = { version = "3.8.0", features = ["bson-3"] }
serde = "1.0.228"
tokio = { version = "1.53.1", features = ["full"] }
prisma = { path = "../prisma" }
exam-utils = { path = "../exam-utils" }
dotenvy = "0.15.7"
futures-util = "0.3.33"
indicatif = "0.18.6"
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
regex = "1.13.1"
supabase_rs = "0.7.0"
